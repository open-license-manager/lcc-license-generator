name: Windows standard tests
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
jobs:
   build-windows:
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          #build_type: ["Debug", "Release"]
          #os: ["windows-2025", "windows-2022"]
          #static: ["true","false"]
          build_type: ["Debug"]
          os: ["windows-2022"]
          static: ["FALSE"]
      steps:
      -  uses: actions/checkout@v6
      -  name: Set reusable strings
         # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
         id: strings
         shell: bash
         run: |
            echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
      -  name: install boost boost-msvc-14.2
         shell: bash
         if: ${{ matrix.os == 'windows-2025' }}
         run: |
            choco install -y boost-msvc-14.2 --version 1.74.0
            echo "BOOST_ROOT=C:/local/boost_1_74_0" >> $GITHUB_ENV
      -  name: install boost boost-msvc-14.1
         shell: bash
         if: ${{ matrix.os == 'windows-2022' }}
         run: |
            choco install -y boost-msvc-14.1 --version 1.74.0
            echo "BOOST_ROOT=C:/local/boost_1_74_0" >> $GITHUB_ENV     
      -  name: Configure
         working-directory: ${{ steps.strings.outputs.build-output-dir }}
         run: >
            cmake -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
               -DSTATIC_RUNTIME:BOOL=${{matrix.static}} -DLCC_PROJECT_NAME:STRING=test \
               -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
               -S ${{ github.workspace }} \
               -B ${{ steps.strings.outputs.build-output-dir }} \
               -DCMAKE_INSTALL_PREFIX=${{ steps.strings.outputs.build-output-dir }}/install
         shell: bash
      -  name: Compile
         working-directory: ${{ steps.strings.outputs.build-output-dir }}
         run: >
            cmake -B ${{ steps.strings.outputs.build-output-dir }} --target install \
               --config ${{ matrix.build_type }} -S ${{ github.workspace }}
         shell: bash
      -  name: Test
         run: |
            ctest -C ${{ matrix.build_type }}
         shell: bash
         env:
            CTEST_OUTPUT_ON_FAILURE: 1
            VIRTUAL_ENV: VM
      -  name: Inspector
         run: C:/licensecc/bin/test/lccinspector.exe
         shell: bash

      -  name: On Failure print logs
         if: ${{ failure() }}
         run: |
           type $env:temp/open-license.log

 
