name: Windows build
on:
   push:
     branches: [ "develop" ]
   pull_request:
     branches: [ "develop" ]
jobs:
   build-windows:
      name: '${{ matrix.os }}, build: ${{ matrix.build_type }} static ${{ matrix.static }} ssl: ${{ matrix.openssl_version }} boost: ${{ matrix.boost_version }}'
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: true
        matrix:
          static: ["TRUE"] #keep just static for now
          #build_type: ["Debug", "Release"]
          build_type: ["Release"]
          os: ["windows-2025", "windows-2022"]
          boost_version: [1.90.0]
          boost_msvc_version: [14.3]
          #openssl_version: ["None", "1.1.1.2100", "3.1.1", "4.0.1"]
          openssl_version: ["None", "3.1.1", "4.0.1"]
          
          include:
          - os: windows-2025
            boost_version: 1.64.0
            openssl_version: 1.1.1.2100
            build_type: "Debug"
            static: "FALSE"
            boost_msvc_version: 14.1

      steps:
      -  uses: actions/checkout@v6
      -  name: Set reusable strings
         # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
         id: strings
         shell: bash
         run: |
            echo "build-output-dir=${{ github.workspace }}\build" >> "$GITHUB_OUTPUT"
            if [ "${{ matrix.openssl_version }}" != "None" ]; then
               echo "use-openssl=TRUE" >> "$GITHUB_OUTPUT"
            else
               echo "use-openssl=FALSE" >> "$GITHUB_OUTPUT"
            fi
      -  name: download boost boost-msvc (14.3)
         working-directory: ${{ steps.strings.outputs.build-output-dir }}
         shell: powershell
         run: |
            ${{ github.workspace }}\scripts\windows_download_boost.ps1 ${{ matrix.boost_version }} ${{ matrix.boost_msvc_version }} 64 "${{ steps.strings.outputs.build-output-dir }}"
      -  name: install boost
         id: install-boost
         shell: powershell
         working-directory: ${{ steps.strings.outputs.build-output-dir }}
         run: |
            $Process = Start-Process -Wait -FilePath "${{ steps.strings.outputs.build-output-dir }}\boost.exe" -Argumentlist @( "/VERYSILENT" , "/DIR=${{ steps.strings.outputs.build-output-dir }}/boost") -PassThru
            "boost-root=${{ steps.strings.outputs.build-output-dir }}/boost" >> $env:GITHUB_ENV
            exit $Process.ExitCode
      -  name: install openssl
         id: install-openssl
         if: ${{ matrix.openssl_version != 'None' }}
         shell: powershell
         working-directory: ${{ steps.strings.outputs.build-output-dir }}
         run: |
            choco install -y openssl --version ${{ matrix.openssl_version }}
      -  name: Configure
         working-directory: ${{ steps.strings.outputs.build-output-dir }}
         run: >
            cmake -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBoost_ROOT=${{ steps.strings.outputs.build-output-dir }}/boost
            -DSTATIC_RUNTIME:BOOL=${{matrix.static}} -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install -DCMAKE_GENERATOR=Ninja 
            -S ${{ github.workspace }} -B ${{ steps.strings.outputs.build-output-dir }} 
            -DUSE_OPENSSL=${{ steps.strings.outputs.use-openssl }} -DOpenSSL_ROOT_DIR="C:/Program Files/OpenSSL-Win64"
      -  name: Compile
         working-directory: ${{ steps.strings.outputs.build-output-dir }}
         run: >
            cmake --build ${{ steps.strings.outputs.build-output-dir }} --target install --config ${{ matrix.build_type }}
      -  name: Test
         working-directory: ${{ steps.strings.outputs.build-output-dir }}
         run: |
            ctest -C ${{ matrix.build_type }} --test-dir ${{ steps.strings.outputs.build-output-dir }} --output-on-failure
         env:
            CTEST_OUTPUT_ON_FAILURE: 1
            BOOST_TEST_LOG_LEVEL: message
      -  name: license generator run
         run: |
           dir ${{ github.workspace }}\install\bin
           ${{ github.workspace }}\install\bin\lccgen.exe version
      - name: Package
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        if: ${{ matrix.os == 'windows-2025' && matrix.static == 'TRUE' && matrix.build_type == 'Release' && matrix.openssl_version == 'None' }}
        run: |
         cpack --config ${{ steps.strings.outputs.build-output-dir }}\CPackConfig.cmake
      - name: Upload artifact
        if: ${{ matrix.os == 'windows-2025' && matrix.static == 'TRUE' && matrix.build_type == 'Release' && matrix.openssl_version == 'None' }}
        uses: actions/upload-artifact@v7
        with:
         name: artifacts-${{ matrix.os }}
         path: ${{ steps.strings.outputs.build-output-dir }}\dist\lcc-license-generator-2.1.0_Windows-AMD64.exe
         retention-days: 1
         overwrite: true

   install:
    needs: build-windows
    runs-on: windows-2025
    name: 'Install Windows Standard'
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: artifacts-${{ matrix.os }}
        path: ${{ github.workspace }}/dist/lcc-license-generator-2.1.0_Windows-AMD64.exe
        
    - name: Install package
      run: |
        # Install the downloaded package
        cd ${{ github.workspace }}/dist
        lcc-license-generator-2.1.0_Windows-AMD64.exe /S
        
    - name: Install verification
      run: |
        # Check that lccgen.exe is properly installed
        if (Test-Path "C:\Program Files\OpenLicenseManager\bin\lccgen.exe") {
          Write-Output "lccgen.exe found at C:\Program Files\OpenLicenseManager\bin\lccgen.exe"
          Write-Output "Testing lccgen execution..."
          $result = & "C:\Program Files\OpenLicenseManager\bin\lccgen.exe" version
          if ($LASTEXITCODE -eq 0) {
            Write-Output "lccgen version executed successfully"
          } else {
            Write-Output "Error: lccgen version failed with exit code $LASTEXITCODE"
            exit 1
          }
        } else {
          Write-Output "Error: lccgen.exe not found at C:\Program Files\OpenLicenseManager\bin\lccgen.exe"
          exit 1
        }

        

 
