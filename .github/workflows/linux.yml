name: Linux build
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: '${{ matrix.os }}, build:${{ matrix.build_type }}, static:${{ matrix.static }}, ccov:${{ matrix.code_coverage }}'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-26.04]
        build_type: [Debug,Release]
        cpp_compiler: [g++, clang++]
        static: ["true","false"] #after just stick to static for lccgen.
        code_coverage: ["OFF"]
        exclude:
        - os: ubuntu-26.04
          build_type: "Debug"
          static: "FALSE"
          cpp_compiler: g++
          code_coverage: "OFF"         
        include:
        - os: ubuntu-24.04-arm
          build_type: "Release"
          static: "TRUE"
          cpp_compiler: g++
          code_coverage: "OFF"
        - os: ubuntu-26.04
          build_type: "Debug"
          static: "FALSE"
          cpp_compiler: g++
          code_coverage: "ON"

    steps:
    - uses: actions/checkout@v6
    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
    - name: Dependencies
      run: >
          sudo apt-get -y install cmake valgrind libssl-dev zlib1g-dev libboost-test-dev libboost-filesystem-dev 
          libboost-iostreams-dev libboost-program-options-dev libboost-system-dev libboost-thread-dev libboost-date-time-dev
          rpm
      # Install extra deps for ubuntu 26-04 (and add valgrind and coverage tests)
    - name: Extra Dependecies Ubuntu 26.04
      if: ${{ matrix.os == 'ubuntu-26.04' }}
      run: >
        sudo apt-get install -y libjitterentropy3-dev valgrind lcov

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: >
        /usr/bin/cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}
        -DSTATIC_RUNTIME:BOOL=${{matrix.static}} --install-prefix /usr/bin
        -DCODE_COVERAGE=${{ matrix.code_coverage }}
    - name: Build
      # Build your program with the given configuration. 
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
           /usr/bin/cmake --build ${{ steps.strings.outputs.build-output-dir }} -j $(nproc)
    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest . --build-config ${{ matrix.build_type }} --output-on-failure
      env:
         CTEST_OUTPUT_ON_FAILURE: 1
         BOOST_TEST_LOG_LEVEL: message
    - name: Memory checks in ubuntu 26.04
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      if: ${{ matrix.os == 'ubuntu-26.04' && matrix.static == 'false' }}
      run: >
          ctest -T memcheck --output-on-failure
    - name: Package
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      if: ${{  (matrix.os == 'ubuntu-26.04' || matrix.os == 'ubuntu-24.04-arm' ) && matrix.static == 'true' && matrix.build_type == 'Release' }}
      run: |
          cpack --config ${{ steps.strings.outputs.build-output-dir }}/CPackConfig.cmake
          cpack --config ${{ steps.strings.outputs.build-output-dir }}/CPackSourceConfig.cmake

    - name: Upload artifact ARM/x64
      uses: actions/upload-artifact@v7
      if: ${{ (matrix.os == 'ubuntu-26.04' || matrix.os == 'ubuntu-24.04-arm' ) && matrix.static == 'true' && matrix.build_type == 'Release' && matrix.cpp_compiler == 'g++' }}
      with:
        name: artifacts-${{ matrix.os }}
        path: ${{ steps.strings.outputs.build-output-dir }}/dist
        retention-days: 1
        overwrite: true
    - name: Filter Coverage
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      if: ${{ matrix.code_coverage == 'ON' }}
      run: | 
          lcov --ignore-errors mismatch,inconsistent --directory . --capture --output-file ${{ steps.strings.outputs.build-output-dir }}/coverage.info
          lcov --ignore-errors mismatch,inconsistent --remove ${{ steps.strings.outputs.build-output-dir }}/coverage.info '/usr/*' '*/ini/*' '*/test/*' '*/inja/*' --output-file '${{ steps.strings.outputs.build-output-dir }}/coverage.info'
          lcov --list ${{ steps.strings.outputs.build-output-dir }}/coverage.info # Optional: prints a quick summary in the GitHub Actions logs
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      continue-on-error: true
      if: ${{ matrix.code_coverage == 'ON' }}
      with:
          file: ${{ steps.strings.outputs.build-output-dir }}/coverage.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: 'open-license-manager/lcc-license-generator'
