name: macOS build
on:
  push:
    branches: [ "develop" ]
#  pull_request:
#    branches: [ "develop" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-26] 
    steps:
    - uses: actions/checkout@v6
    
    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        
    - name: Install Homebrew dependencies
      run: |
        # Update Homebrew
        brew update
        # Install dependencies
        brew install cmake boost openssl
        
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}
        -DSTATIC_RUNTIME:BOOL=FALSE #static runtime has little sense in MacOS
        -DCMAKE_OSX_ARCHITECTURES=arm64 --log-level=VERBOSE
    - name: Build
      # Build your program with the given configuration. 
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
           cmake --build ${{ steps.strings.outputs.build-output-dir }} --verbose
           
    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest . --output-on-failure
      env:
         CTEST_OUTPUT_ON_FAILURE: 1
         BOOST_TEST_LOG_LEVEL: message
         
    - name: Package
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
          cpack --config ${{ steps.strings.outputs.build-output-dir }}/CPackConfig.cmake
 
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-${{ matrix.os }}
        path: ${{ steps.strings.outputs.build-output-dir }}/dist
        retention-days: 1
        overwrite: true

  install:
    needs: build
    runs-on: ${{ matrix.os }}
    name: 'Install ${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-26]
    steps:
    #- uses: actions/checkout@v6
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: artifacts-${{ matrix.os }}
        path: ${{ github.workspace }}/dist
        
    - name: Install package
      run: |
        # Install the downloaded package
        cd ${{ github.workspace }}/dist
        for pkg in *.pkg; do
          if [ -f "$pkg" ]; then
            echo "Installing $pkg..."
            sudo installer -pkg "$pkg" -target /
          fi
        done
        
    - name: Check installation
      run: |
        # Check that lccgen is properly installed
        if [ -f "/usr/local/bin/lccgen" ]; then
          echo "lccgen found at /usr/local/bin/lccgen"
          ls -l /usr/local/bin/lccgen
          if [ -x "/usr/local/bin/lccgen" ]; then
            echo "lccgen is executable"
          else
            echo "Error: lccgen is not executable"
            exit 1
          fi
        else
          echo "Error: lccgen not found at /usr/local/bin/lccgen"
          exit 1
        fi
        
    - name: Launch lccgen
      run: |
        # Launch lccgen to verify it works correctly
        echo "Launching lccgen version..."
        /usr/local/bin/lccgen version
        if [ $? -eq 0 ]; then
          echo "lccgen version executed successfully"
        else
          echo "Error: lccgen version failed"
          exit 1
        fi
