name: macOS build
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: '${{ matrix.os }}, build:${{ matrix.build_type }}, static:${{ matrix.static }}'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]  # Using macOS-26 ARM runner
        build_type: [Debug, Release]
        static: ["true", "false"]
        exclude:
        - os: macos-26
          build_type: "Debug"
          static: "false"
        include:
        - os: macos-26
          build_type: "Release"
          static: "true"

    steps:
    - uses: actions/checkout@v6
    
    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        
    - name: Install Homebrew dependencies
      run: |
        # Update Homebrew
        brew update
        # Install dependencies
        brew install cmake boost openssl
        
    - name: Set OpenSSL environment variables
      run: |
        # Use the system OpenSSL that comes with macOS
        # On macOS, OpenSSL is typically available via Homebrew at /opt/homebrew/opt/openssl
        # or at the default location
        if [ -d "/opt/homebrew/opt/openssl" ]; then
          echo "OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        else
          # Fallback to finding OpenSSL via brew
          OPENSSL_PATH=$(brew --prefix openssl)
          if [ -n "$OPENSSL_PATH" ]; then
            echo "OPENSSL_ROOT_DIR=$OPENSSL_PATH" >> $GITHUB_ENV
            echo "PKG_CONFIG_PATH=$OPENSSL_PATH/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          fi
        fi
        
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}
        -DSTATIC_RUNTIME:BOOL=${{ matrix.static }}
        -DCMAKE_OSX_ARCHITECTURES=arm64 --log-level=VERBOSE
#-DOpenSSL_ROOT_DIR="${{ env.OPENSSL_ROOT_DIR }}"
    - name: Build
      # Build your program with the given configuration. 
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
           cmake --build ${{ steps.strings.outputs.build-output-dir }} --verbose
           
    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest . --build-config ${{ matrix.build_type }} --output-on-failure
      env:
         CTEST_OUTPUT_ON_FAILURE: 1
         BOOST_TEST_LOG_LEVEL: message
         
    - name: Package
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      if: ${{ matrix.static == 'true' && matrix.build_type == 'Release' }}
      run: |
          cpack --config ${{ steps.strings.outputs.build-output-dir }}/CPackConfig.cmake
          cpack --config ${{ steps.strings.outputs.build-output-dir }}/CPackSourceConfig.cmake

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      if: ${{ matrix.static == 'true' && matrix.build_type == 'Release' }}
      with:
        name: artifacts-${{ matrix.os }}
        path: ${{ steps.strings.outputs.build-output-dir }}/dist
        retention-days: 1
        overwrite: true